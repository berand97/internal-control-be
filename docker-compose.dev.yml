# Postgres local. No lo uses en Dokploy (Dokploy detecta docker-compose.yml).
# Arranque: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    # Misma versión que producción (Dokploy corre 18.6).
    image: postgres:18.6
    environment:
      POSTGRES_USER: asset_admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: asset_management
    ports:
      - "5432:5432"
    volumes:
      # Desde la 18 la imagen guarda los datos en /var/lib/postgresql/18/...;
      # montar /var/lib/postgresql/data hace que el contenedor no arranque.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_admin -d asset_management"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Misma imagen que producción (docker-compose.yml). GOTENBERG_URL=http://localhost:3100
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-libreoffice@sha256:f1d5a60e9ddcfa9b0788ec6ef80b43520ec2a8e9f59d9e2cf965b7416cb09ad1
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
