name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3100:3000
    steps:
      - uses: actions/checkout@v4

      # Misma versión de pnpm y Node que el Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm test:int
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          GOTENBERG_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ciclo-completo-e2e
          path: ${{ runner.temp }}/e2e
          retention-days: 7
          if-no-files-found: warn
