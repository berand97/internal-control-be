name: Pasar a QA

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Si empieza una versión nueva: patch (correcciones), minor (funciones nuevas) o major'
        type: choice
        options: [minor, patch, major]
        default: minor
      ref:
        description: 'Rama o commit a probar (master, o release/x.y para una corrección puntual)'
        default: master

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cortar candidata y mover qa
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          REF: ${{ inputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/release.sh cut "$BUMP" "$REF"
