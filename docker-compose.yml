services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: asset_admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: asset_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_admin -d asset_management"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

