# Dokploy detecta este archivo y el Dockerfile de la misma carpeta.
# En la UI, monta el volumen backend_storage en /data/storage si no usa Compose.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_DRIVER: project
      STORAGE_PROJECT_PATH: /data/storage
      RUN_MIGRATIONS: "true"
    volumes:
      - backend_storage:/data/storage

volumes:
  backend_storage:
